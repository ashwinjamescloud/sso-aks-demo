apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  ENTRA_TENANT_ID: "{{ .Values.entra.tenantId }}"
  ENTRA_CLIENT_ID: "{{ .Values.entra.clientId }}"
  REDIRECT_URI: "{{ .Values.entra.redirectUri }}"
  POST_LOGOUT_REDIRECT_URI: "{{ .Values.entra.postLogoutRedirectUri }}"
  KEYVAULT_URL: "{{ .Values.keyvault.url }}"
  KEYVAULT_SECRET_NAME: "{{ .Values.keyvault.secretName }}"
